[uwsgi]
strict = true
die-on-term = true
need-app = true
single-interpreter = true

http = 127.0.0.1:8080

# In order to uses JavaScript Crypto API, you need to serve the page over HTTPS
# https = 127.0.0.1:8443,tls.crt,tls.key

module = msgursrv:app
procname-prefix = msgur-sample-

# For debug purpose only
py-autoreload = 1
