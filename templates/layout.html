<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">

  <title>{% block title %}{% endblock %}</title>

  <!-- Not minified for now, easier to audit -->
  <link href="/static/css/bootstrap.css" rel="stylesheet">
  <script src="/static/js/msgur.js"></script>
</head>

<body data-bs-theme="dark">
  <!-- Placeholder for a modal if browser doesn't support cryptograph -->
  <div class="modal fade" id="modal-no-crypto" tabindex="-1" aria-labelledby="no-cypto-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-bg-danger">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="no-crypto-title">Cryptography unavailable</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-bg-dark">
        It seems that your browser doesn't supports cryptography features. This service requires them.
      </div>
    </div>
    </div>
  </div>

  <main class="container-fluid bg-dark d-flex flex-column justify-content-between">
    <div class="container py-4">
    {% block content %}
    {% endblock %}
    </div>
  </main>

  <footer class="border-top d-flex justify-content-center align-items-center">
    <div class="container my-3">
      <div class="d-flex justify-content-center justify-content-md-between align-items-center flex-column flex-md-row gap-3">
        <div class="text-center text-md-start small text-grayx-500 position-relative">
        <div class="fw-bold">Msgur (Messengur, Secure Messaging)</div>
        <div>&copy; {{ now.year }} - Maxux Network</div>
        <a href="/" class="stretched-link"></a>
      </div>

      <div class="render-half-badge fs-6x position-relative">
        <span class="badge badge-left bg-pink-800">Revision</span>
        <span class="badge badge-right bg-grayx-700">{{ revision or "(unknown)" }}</span>
        <a href="https://github.com/maxux/msgur" target="_blank" class="stretched-link"></a>
      </div>
    </div>
    </div>
  </footer>

  <!-- Last hard external dependency so far, used for Modal and others features -->
  <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
